[package]
name = "coffe-core"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
directories = "6.0.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
toml = "1.1.5"

[dev-dependencies]
serde_json = "1.0.151"
