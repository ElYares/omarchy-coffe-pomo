# Copiar a ~/.config/hypr/windowrules-coffe.conf y anadir en hyprland.conf:
#   source = ~/.config/hypr/windowrules-coffe.conf

# coffe - el pomodoro
#
# Flotante y centrada: es una ventana que se abre, se mira y se cierra, no un
# sitio donde se vive. Metida en el mosaico le robaria la mitad de la pantalla
# a lo que de verdad se esta haciendo, que es justo lo que la tarea mide.
#
# Ojo: en windowrule la REGLA va primero y el match despues, si no queda inerte.

windowrule = float on,        match:class ^(coffe-app|coffe)$
windowrule = size 980 680,    match:class ^(coffe-app|coffe)$
windowrule = center on,       match:class ^(coffe-app|coffe)$

# La taza es un degradado y el reloj es texto fino: la opacidad global de
# omarchy se los come. Aqui va opaca.
windowrule = opacity 1.0 1.0, match:class ^(coffe-app|coffe)$
