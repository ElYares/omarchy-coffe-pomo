# Pega esto en ~/.config/hypr/bindings.conf.

# Pomodoro (coffe). SUPER ALT + P es una sola tecla para las dos mitades de la
# misma idea: con el reloj corriendo manda la tarea al refri, y con el reloj
# parado saca del refri lo ultimo que guardaste. Gastar dos atajos en eso seria
# tener que acordarse de cual toca.
#
# El metodo NO deja pausar un pomodoro, asi que "al refri" lo ANULA. Lo que se
# conserva es el tiempo acumulado de la TAREA, que es lo que importa.
#
# SUPER SHIFT ALT + P apunta una interrupcion externa sin cortar nada: alguien
# te habla, le dices que ahora vas, pulsas y sigues. Es la comilla doble de la
# hoja de Cirillo.
#
# El resultado de las dos llega por notificacion: desde un atajo no hay stdout
# que leer. Ninguna de las dos estaba ocupada; no hace falta unbind.
bindd = SUPER ALT, P, Pomodoro (arrancar o al refri), exec, coffe click toggle
bindd = SUPER SHIFT ALT, P, Pomodoro: apuntar interrupcion, exec, coffe click interrupt
